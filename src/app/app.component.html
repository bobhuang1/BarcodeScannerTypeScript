<ion-app>
  <ion-menu side="start" menuId="main" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/home" routerDirection="root">
            <ion-icon name="home" slot="start"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
          <ion-item button routerLink="/options">
            <ion-icon name="options" slot="start"></ion-icon>
            <ion-label>Options</ion-label>
          </ion-item>
          <ion-item button routerLink="/debug">
            <ion-icon name="bug" slot="start"></ion-icon>
            <ion-label>Debug</ion-label>
          </ion-item>
          <ion-item button routerLink="/about">
            <ion-icon name="information-circle" slot="start"></ion-icon>
            <ion-label>About</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
