<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Paste configuration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-label position="stacked">
    Multi-conf content (INI with [general] and [raw] sections)
  </ion-label>
  <ion-textarea
    [(ngModel)]="content"
    rows="10"
    placeholder="[general]&#10;product = d600&#10;&#10;[raw]&#10;00 = 00&#10;..."
    class="mono-text"
  ></ion-textarea>

  <ion-button expand="block" color="primary" (click)="applyConfiguration()">
    Apply configuration
  </ion-button>

  <pre *ngIf="result" class="mono-text result">{{ result }}</pre>
</ion-content>
