<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Barcode Scanner</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label><b>Status: {{ scanstatus }}</b></ion-label>
  </ion-item>

  <ion-button expand="block" color="success" (click)="startScan()">
    <ion-icon name="radio-outline" slot="start"></ion-icon>
    Start scan
  </ion-button>
  <ion-button expand="block" color="medium" (click)="stopScan()">
    <ion-icon name="stop-circle-outline" slot="start"></ion-icon>
    Stop scan
  </ion-button>

  <ion-list>
    <ion-list-header>Scanners found</ion-list-header>

    <ion-item *ngFor="let device of items" button [routerLink]="'/connect/' + device.id">
      <ion-icon name="hardware-chip" slot="start"></ion-icon>
      <ion-label>
        <h2>{{ device.name }}</h2>
        <p class="mono-text">{{ device.id }}</p>
      </ion-label>
      <span class="rssi-pill" slot="end">
        {{ device.rssi }} dBm ({{ device.rssiPercent }}%)
      </span>
    </ion-item>

    <ion-item *ngIf="items.length === 0 && scanstatus === 'Scanning'">
      <ion-label color="medium">Scanning for scanners…</ion-label>
    </ion-item>
    <ion-item *ngIf="items.length === 0 && scanstatus === 'Stopped'">
      <ion-label color="medium">No scanner found. Start a scan.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
