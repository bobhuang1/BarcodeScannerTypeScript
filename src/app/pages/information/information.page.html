<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Scanner information</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of deviceinformation">
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p class="mono-text">{{ item.value }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item-group>
    <ion-item-divider>Rename scanner</ion-item-divider>
    <ion-item>
      <ion-label position="stacked">New name</ion-label>
      <ion-input
        [(ngModel)]="newDeviceName"
        placeholder="Type the new scanner name"
      ></ion-input>
    </ion-item>
  </ion-item-group>

  <ion-button expand="block" color="primary" (click)="changeDeviceName()">
    Rename scanner
  </ion-button>
</ion-content>
